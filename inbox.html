<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>trimESTER – Inbox</title>
  <link rel="stylesheet" href="5541.css">
</head>
<body>

<div id="leftcolumn">
  <div class="brand"><span>trim</span>ESTER</div>
  <nav>
    <a href="home.html">⌂ Home</a>
    <a href="inbox.html" class="active">✉ Inbox</a>
    <a href="logs.html">☰ Logs</a>
    <a href="progress.html">◈ Progress</a>
    <a href="community.html">♺ Community</a>
    <a href="settings.html">⚙ Settings</a>
    <a href="logout.html" class="logout">⏻ Logout</a>
  </nav>
</div>

<div id="content">
  <div class="page-title">
    <h2>Inbox</h2>
    <h4>Your messages</h4>
  </div>

  <div class="card section">
    <div class="inline-form">
      <input type="text" id="msg" placeholder="Write a message…" style="flex:1;min-width:200px;">
      <button class="btn btn-primary" onclick="send()">Send</button>
    </div>
  </div>

  <div class="card">
    <div id="messages"></div>
    <p id="empty" style="color:var(--muted);font-size:13px;display:none;">No messages yet.</p>
  </div>
</div>

<script>
let msgs = JSON.parse(localStorage.getItem('msgs')) || [];

function send() {
  const m = document.getElementById('msg').value.trim();
  if (!m) return;
  msgs.push({ text: m, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
  localStorage.setItem('msgs', JSON.stringify(msgs));
  document.getElementById('msg').value = '';
  render();
}

function render() {
  const c = document.getElementById('messages');
  const e = document.getElementById('empty');
  if (!msgs.length) { c.innerHTML = ''; e.style.display = 'block'; return; }
  e.style.display = 'none';
  c.innerHTML = msgs.map(m =>
    `<div class="msg-item"><strong>You</strong> <span style="color:var(--muted);font-size:11px;margin-left:8px;">${m.time || ''}</span><br>${m.text || m}</div>`
  ).join('');
}

document.getElementById('msg').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
render();
</script>
</body>
</html>
